# Operator verification resources. Secrets are referenced by ENV VAR NAME only
# (never put real numbers, addresses, tokens or passwords in this file).
# Point AGENTBROWSER_RESOURCES at a copy of this file.
resources:
  phones:
    - id: twilio-1
      number_env: TWILIO_NUMBER_1   # E.164 number, from the environment
      provider: twilio
    - id: twilio-2
      number_env: TWILIO_NUMBER_2
      provider: twilio
  mailboxes:
    - id: gmail-main
      host: imap.gmail.com
      # Gmail default is an app password (needs 2-Step Verification on): create one
      # at https://myaccount.google.com/apppasswords and set GMAIL_IMAP_PASSWORD.
      auth: app_password
      username_env: GMAIL_USER
      password_env: GMAIL_IMAP_PASSWORD
      # Alternative when app passwords are disabled: auth: oauth2 with
      #   oauth_client_id_env: GMAIL_OAUTH_CLIENT_ID
      #   oauth_client_secret_env: GMAIL_OAUTH_CLIENT_SECRET
      # then run `agentbrowser mailbox login --mailbox gmail-main`.
      address_envs:                 # the alias addresses that land in this mailbox
        - GMAIL_ALIAS_1
        - GMAIL_ALIAS_2
        # Relay/forwarding aliases that land in this mailbox (e.g. an address of
        # the form user+N@relay.example that forwards into GMAIL_USER's inbox)
        # also belong here, referenced by env var. Sub-addressing is
        # canonicalised, so listing one "+N" alias matches every "+N" that
        # shares the same base.
        - GMAIL_ALIAS_3

providers:
  twilio:
    account_sid_env: TWILIO_ACCOUNT_SID
    auth_token_env: TWILIO_AUTH_TOKEN
    poll_interval: 3s

accounts:
  - id: acct-a
    email_env: GMAIL_ALIAS_1        # resolves to the gmail-main mailbox
    phone: twilio-1
  - id: acct-b
    email_env: GMAIL_ALIAS_2
    phone: twilio-2

totp:
  enroll_when_prompted: true
