<!doctype html><html><head><title>Login</title>
<script src="https://hcaptcha.com/1/api.js" async defer></script></head>
<body><form method="post" action="/login" id="login-form">
  <input name="email" type="email"><input name="password" type="password">
  <div class="h-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001" data-callback="hcb" data-rqdata="rq_abc"></div>
  <textarea name="h-captcha-response"></textarea>
  <button type="submit">Login</button>
</form></body></html>
