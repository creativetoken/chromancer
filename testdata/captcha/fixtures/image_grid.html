<!doctype html><html><head><title>Select images</title></head>
<body><div class="captcha-grid" data-captcha="grid" aria-label="Select all images with a traffic light">
  <p>Select all squares with <b>traffic lights</b></p>
  <div class="tiles">
    <img class="tile" data-truth="1" src="/t/0.png" width="100" height="100">
    <img class="tile" data-truth="0" src="/t/1.png" width="100" height="100">
    <img class="tile" data-truth="1" src="/t/2.png" width="100" height="100">
    <img class="tile" data-truth="0" src="/t/3.png" width="100" height="100">
    <img class="tile" data-truth="0" src="/t/4.png" width="100" height="100">
    <img class="tile" data-truth="1" src="/t/5.png" width="100" height="100">
    <img class="tile" data-truth="0" src="/t/6.png" width="100" height="100">
    <img class="tile" data-truth="0" src="/t/7.png" width="100" height="100">
    <img class="tile" data-truth="0" src="/t/8.png" width="100" height="100">
  </div>
  <input type="hidden" name="captcha-token" data-captcha-token>
  <button id="verify">Verify</button>
</div></body></html>
